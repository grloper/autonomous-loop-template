name: "Manual PR review and merge"

# Human-triggered escape hatch for acting on a PR without waiting for, or
# overriding, the automatic reviewer.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to act on'
        required: true
        type: number
      action:
        description: 'Action to take'
        required: true
        type: choice
        options:
          - 'approve-and-merge'
          - 'approve-only'
          - 'just-merge'
          - 'request-changes'
        default: 'approve-only'
      reason:
        description: 'Why (recorded in the review body)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  act:
    name: "Act on pull request"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout: every step here talks to the API only, so there is no
    # reason to place PR code on the runner.

    steps:
      - name: Approve
        if: inputs.action == 'approve-and-merge' || inputs.action == 'approve-only'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const { PR_NUMBER, REASON, ACTOR } = process.env;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(PR_NUMBER),
              event: 'APPROVE',
              body: `Manually approved by @${ACTOR}.\n\n${REASON || '(no reason given)'}`,
            });

      - name: Request changes
        if: inputs.action == 'request-changes'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const { PR_NUMBER, REASON, ACTOR } = process.env;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(PR_NUMBER),
              event: 'REQUEST_CHANGES',
              body: `Changes requested by @${ACTOR}.\n\n${REASON || '(no reason given)'}`,
            });

      - name: Merge
        if: inputs.action == 'approve-and-merge' || inputs.action == 'just-merge'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              merge_method: 'squash',
            });
            core.info(`Merged PR #${number}`);

            // GitHub already closes issues linked by a closing keyword when the
            // PR merges into the default branch. Only report those here.
            //
            // The previous version matched every `#\d+` in the PR body and
            // closed each one, so a PR that merely referenced "see #42" would
            // close issue 42. Requiring a closing keyword avoids that.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const linked = [...(pr.body || '').matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi
            )].map(m => m[1]);
            core.info(linked.length
              ? `Linked issues closed by GitHub: ${linked.join(', ')}`
              : 'No closing-keyword links found in the PR body.');

      - name: Summary
        if: always()
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "## Manual PR action"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- Action: ${ACTION}"
            echo "- Triggered by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
