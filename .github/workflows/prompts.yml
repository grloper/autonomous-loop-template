name: "Improve agent instructions"

# Reads what actually went wrong and proposes edits to the instructions file
# that would have prevented it. Proposals go to a human as an issue; nothing is
# applied automatically. An agent that can edit its own guardrails can remove
# them, which is the CVE-2025-53773 pattern.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays, 07:00 UTC — after the trust measurement
  workflow_dispatch:
    inputs:
      days:
        description: 'Window to analyse, in days'
        type: string
        default: '90'
      min_occurrences:
        description: 'Times a failure must recur before a rule is proposed'
        type: string
        default: '3'

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: prompt-improvement
  cancel-in-progress: false

jobs:
  propose:
    name: "Propose instruction changes"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then pip install "anthropic>=0.40,<1"; fi

      - name: Analyse failures
        id: analyse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without it, synthesis is skipped and the hand-written
          # catalogue still produces proposals.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .github/scripts/prompts.py \
            --repo "${{ github.repository }}" \
            --days "${{ inputs.days || '90' }}" \
            --min-occurrences "${{ inputs.min_occurrences || '3' }}" \
            ${{ inputs.synthesize == true && '--synthesize' || '' }}

      - name: File or update the proposal
        if: steps.analyse.outputs.has_proposals == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.analyse.outputs.report }}
        with:
          script: |
            const { REPORT } = process.env;
            const marker = '<!-- agent-gate:prompt-proposal -->';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prompt-improvement',
              per_page: 100,
            });
            const existing = open.find(i => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: REPORT,
              });
              core.info(`Updated proposal issue #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Proposed improvements to agent instructions',
                body: REPORT,
                labels: ['prompt-improvement'],
              });
              core.info(`Filed proposal issue #${data.number}`);
            }
