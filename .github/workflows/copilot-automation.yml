name: "Auto-Review Pull Requests"

# SECURITY NOTES — read before editing this file.
#
# 1. This workflow decides whether a PR may merge. It must therefore never
#    execute code that comes from the pull request itself. The checkout below
#    pins to `base.sha` (the trusted target branch), not to the PR head. With a
#    head checkout, a PR could rewrite auto_reviewer.py and approve itself.
#
# 2. Values controlled by a PR author (title, body, branch name) are passed to
#    scripts through `env:`, never interpolated into a `${{ }}` expression
#    inside a script body. Direct interpolation allows script injection via a
#    crafted PR title.
#
# 3. Actions are referenced by major-version tag. For a workflow holding
#    `contents: write`, pinning each action to a full commit SHA is stronger —
#    tag rewrites have been used to compromise Actions consumers in the past.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    name: "Review pull request"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@v4
        with:
          # Never the PR head: the reviewer must not be code the PR supplied.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Analyze pull request
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/auto_reviewer.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Post review
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ steps.analyze.outputs.verdict }}
          SUMMARY: ${{ steps.analyze.outputs.summary }}
          BLOCKERS: ${{ steps.analyze.outputs.blockers }}
          CONCERNS: ${{ steps.analyze.outputs.concerns }}
          CRITICAL_FILES: ${{ steps.analyze.outputs.critical_files }}
        with:
          script: |
            // All PR-controlled and script-produced values arrive via env, so
            // nothing here is interpolated into the script text itself.
            const { VERDICT, SUMMARY, BLOCKERS, CONCERNS, CRITICAL_FILES } = process.env;

            const sections = [`**Auto-review: ${VERDICT}**`, '', SUMMARY, ''];
            if (CONCERNS && CONCERNS !== 'None') {
              sections.push('### Findings in the diff', CONCERNS, '');
            }
            if (BLOCKERS && BLOCKERS !== 'None') {
              sections.push('### Why this will not auto-merge', BLOCKERS, '');
            }
            if (CRITICAL_FILES && CRITICAL_FILES !== 'None') {
              sections.push('### Critical files touched', CRITICAL_FILES, '');
            }
            sections.push('---', '_Posted by the auto-reviewer._');

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: VERDICT === 'APPROVE' ? 'APPROVE'
                   : VERDICT === 'REQUEST_CHANGES' ? 'REQUEST_CHANGES'
                   : 'COMMENT',
              body: sections.join('\n'),
            });

      # Auto-merge runs in a separate job so that the only step holding
      # `contents: write` is the merge itself, gated on an APPROVE verdict.
    outputs:
      verdict: ${{ steps.analyze.outputs.verdict }}
      auto_merge: ${{ steps.analyze.outputs.auto_merge }}

  auto-merge:
    name: "Merge approved documentation change"
    needs: auto-review
    if: needs.auto-review.outputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub's native auto-merge honours branch protection and required
            // checks. The previous version slept 30 seconds on a billed runner
            // as a "human override window" and then force-merged regardless.
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Merged PR #${pr.number}`);
            } catch (error) {
              core.warning(`Auto-merge failed: ${error.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `Auto-merge did not complete: ${error.message}\n\nThis PR needs a manual merge.`,
              });
            }
