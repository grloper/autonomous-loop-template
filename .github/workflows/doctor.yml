name: "Failure doctor"

on:
  workflow_run:
    workflows:
      - "Repository scan"
      - "Merge gate"
      - "CI"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to diagnose'
        required: true
        type: string

# The doctor reads run logs and files an issue. It does not edit workflow
# files, so it does not need `contents: write`.
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  diagnose:
    name: "Diagnose failure"
    # `action_required` is the normal state for a run awaiting approval (for
    # example a first-time contributor's PR). It is not a failure.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Diagnose the failed run
        id: doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'manual' }}
        run: |
          python .github/scripts/doctor.py \
            --repo "${{ github.repository }}" \
            --run-id "$RUN_ID" \
            --workflow-name "$WORKFLOW_NAME"

      - name: File or update the diagnosis issue
        uses: actions/github-script@v7
        env:
          # Passed through env so a workflow name or log excerpt can never be
          # interpreted as part of this script.
          REPORT: ${{ steps.doctor.outputs.report }}
          TITLE: ${{ steps.doctor.outputs.title }}
          ISSUE_TYPE: ${{ steps.doctor.outputs.issue_type }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'manual' }}
        with:
          script: |
            const { REPORT, TITLE, ISSUE_TYPE, WORKFLOW_NAME } = process.env;

            // One open issue per (workflow, failure type). Repeated failures
            // add a comment rather than filing a new issue every time, which
            // is what turns a broken schedule into hundreds of duplicates.
            const marker = `<!-- workflow-doctor:${WORKFLOW_NAME}:${ISSUE_TYPE} -->`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 100,
            });
            const match = existing.find(i => (i.body || '').includes(marker));

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `This failure occurred again.\n\n${REPORT}`,
              });
              core.info(`Updated existing issue #${match.number}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE.slice(0, 250),
                body: `${REPORT}\n${marker}\n`,
                labels: ['workflow-failure', 'autonomous-loop'],
              });
              core.info(`Filed issue #${data.number}`);
            }
